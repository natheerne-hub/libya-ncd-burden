# ---------------------------------------------------------------------------
# Libya NCD Burden & Health-Financing Analysis — central configuration
# Every number used in the analysis is either (a) pulled from a named public
# source or (b) declared here as an explicit, documented assumption.
# ---------------------------------------------------------------------------

focus_country: LBY

countries:
  LBY: Libya
  TUN: Tunisia
  DZA: Algeria
  EGY: Egypt
  MAR: Morocco

# WHO Global Health Observatory (GHO) OData API — https://ghoapi.azureedge.net/api/
# `age_group` keeps the overall age band where GHO splits by age.
who_gho:
  base_url: https://ghoapi.azureedge.net/api
  indicators:
    NCDMORT3070:
      label: Premature NCD mortality, 30–70 (%)
      short: Premature NCD mortality
      domain: outcome
      age_group: AGEGROUP_YEARS30-69
      sdg: "3.4.1"
    NCD_DIABETES_PREVALENCE_AGESTD:
      label: Diabetes prevalence, adults 18+, age-standardized (%)
      short: Diabetes
      domain: risk_factor
      age_group: AGEGROUP_YEARS18-PLUS
    NCD_BMI_30A:
      label: Obesity (BMI ≥ 30), adults 18+, age-standardized (%)
      short: Obesity
      domain: risk_factor
      age_group: AGEGROUP_YEARS18-PLUS
    NCD_PAA:
      label: Insufficient physical activity, adults 18+, age-standardized (%)
      short: Physical inactivity
      domain: risk_factor
      age_group: AGEGROUP_YEARS18-PLUS
    M_Est_tob_curr_std:
      label: Current tobacco use, age-standardized (%)
      short: Tobacco use
      domain: risk_factor
      age_group: null
    NCD_HYP_PREVALENCE_A:
      label: Hypertension prevalence, 30–79, age-standardized (%)
      short: Hypertension
      domain: cascade
      age_group: null
    NCD_HYP_DIAGNOSIS_A:
      label: Hypertension diagnosed, % of hypertensives (age-std.)
      short: Diagnosed
      domain: cascade
      age_group: null
    NCD_HYP_TREATMENT_A:
      label: Hypertension treated, % of hypertensives (age-std.)
      short: Treated
      domain: cascade
      age_group: null
    NCD_HYP_CONTROL_A:
      label: Hypertension controlled, % of hypertensives (age-std.)
      short: Controlled
      domain: cascade
      age_group: null
    GHED_CHEGDP_SHA2011:
      label: Current health expenditure (% of GDP)
      short: CHE % GDP
      domain: financing
      age_group: null
    GHED_CHE_pc_US_SHA2011:
      label: Current health expenditure per capita (current US$)
      short: CHE per capita (US$)
      domain: financing
      age_group: null
    GHED_GGHE-D_pc_US_SHA2011:
      label: Domestic general government health expenditure per capita (US$)
      short: Government health spend per capita (US$)
      domain: financing
      age_group: null
    GHED_OOPSCHE_SHA2011:
      label: Out-of-pocket expenditure (% of CHE)
      short: Out-of-pocket share
      domain: financing
      age_group: null

# WHO tobacco estimates include model projections beyond the last observed year.
max_observed_year: 2024

sdg_3_4:
  baseline_year: 2015
  target_year: 2030
  relative_reduction: 0.3333   # SDG 3.4: reduce premature NCD mortality by one third

# ---------------------------------------------------------------------------
# Health-economic scenario: scaling up hypertension control in Libya
# ---------------------------------------------------------------------------
# STATUS OF PARAMETERS
#   source: data        -> taken from the WHO snapshot at run time
#   source: literature  -> must be backed by a citation in docs/ECONOMIC_MODEL.md
#   source: assumption  -> ILLUSTRATIVE placeholder; replace with a Libyan/
#                          regional sourced value before drawing conclusions.
# dist: distribution for probabilistic sensitivity analysis (PSA).
economics:
  currency: USD
  horizon_years: 5
  discount_rate: 0.03
  target_control_rate: 0.50      # scenario: half of all hypertensives controlled
  wtp_multiples_of_gdp_pc: [0.5, 1.0, 3.0]
  # Reference point for the cost-effectiveness threshold (not a salary; see local_context below)
  gdp_per_capita:
    value_usd: 6569
    year: 2024
    source: World Bank, GDP per capita (current US$), NY.GDP.PCAP.CD (WDI update of 13 Jul 2026)

  psa_iterations: 5000
  random_seed: 20260924
  params:
    population_30_79:
      value: 3527480
      source: data
      note: UN World Population Prospects 2024, Libya, sum of 5-year groups 30–34 … 75–79 (2024).
      dist: {type: normal, sd: 176000}
    annual_cost_per_controlled_patient:
      value: 44
      source: literature
      note: >-
        Upper end of the US$18–44 per person treated per year for the WHO HEARTS package in LMICs
        (Moran et al., Rev Panam Salud Publica 2022;46:e140). Upper end chosen because Libya is upper-middle-income.
      dist: {type: gamma, cv: 0.35}
    programme_cost_per_additional_patient:
      value: 10
      source: assumption
      note: Extra scale-up cost (screening, training, information system) per newly controlled patient-year. Replace with a Libyan programme budget.
      dist: {type: gamma, cv: 0.50}
    baseline_cvd_event_rate_uncontrolled:
      value: 0.0101          # overwritten at run time by the GBD derivation below
      source: gbd
      note: >-
        Derived from GBD 2023 Libya incident IHD + stroke, split between hypertensive and normotensive adults 30–79
        assuming hypertensives carry `rr_hypertension` times the risk (see gbd_derivation).
      dist: {type: beta, cv: 0.20}
    relative_risk_reduction_if_controlled:
      value: 0.20
      source: literature
      note: RR 0.80 (95% CI 0.77–0.83) for major CVD events per 10 mmHg SBP reduction (Ettehad et al., Lancet 2016;387:957–67).
      dist: {type: beta, sd: 0.015}
    cost_per_cvd_event:
      value: 3600
      source: literature
      note: >-
        Regional proxy: mean first-year direct cost per patient in Morocco of US$3,674 for ischaemic stroke
        (Cureus 2023) and US$3,520 for ischaemic heart disease (Value Health Reg Issues 2026;52). Libyan hospital costing preferred.
      dist: {type: gamma, cv: 0.40}
    dalys_per_cvd_event:
      value: 11.9            # overwritten at run time by the GBD derivation below
      source: gbd
      note: >-
        GBD 2023 Libya (IHD + stroke DALYs) ÷ (incident IHD + stroke) = lifetime burden per event (undiscounted),
        discounted at `discount_rate` assuming the burden is spread over `spread_years`.
      dist: {type: gamma, cv: 0.30}

  # How the two `source: gbd` inputs above are derived from data/snapshot/gbd_2023_libya_extract.csv
  gbd_derivation:
    extract: data/snapshot/gbd_2023_libya_extract.csv
    rr_hypertension: 2.0     # assumption: relative CVD risk of hypertensive vs normotensive adults (tested 1.5–3)
    spread_years: 15         # assumption: years over which one event's DALYs accrue (for discounting)

# Local context used only to translate results into everyday terms (policy brief)
local_context:
  avg_monthly_salary_lyd: 2500
  salary_note: >-
    Public-sector average. Central Bank of Libya wage bill ÷ public employees gives about 2,260 LYD/month (2023:
    57 bn LYD, 2.1 M employees) to 2,780 LYD/month (2025: 73.3 bn LYD, ~2.2 M employees). Private sector not included.
  exchange_rate_official: 6.50
  exchange_rate_parallel: 9.80
  exchange_rate_date: 2026-09
